<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F5">
<title>Offline · Redesign Your Life</title>
<!-- Self-contained on purpose: it is shown in place of pages in any folder, so it must not depend on other files. -->
<style>
  :root { color-scheme: light; --bg: #F7F8F5; --ink: #202923; --muted: #737D76; --primary: #173F35; --on-primary: #FFFFFF; --pl: #E2EEE8; --gold: #8A6520; --line: #D5DCD6; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #101713; --ink: #F2F6F2; --muted: #A2B0A7; --primary: #83C5A2; --on-primary: #0B1F16; --pl: #274436; --gold: #E6C98C; --line: #3A4A40; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
  .off { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; box-sizing: border-box;
    background: radial-gradient(90% 60% at 50% 110%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 60%); }
  .card { max-width: 380px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .crest { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: #D5AD62; background: #173F35; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; font: inherit; font-weight: 650; color: var(--on-primary); cursor: pointer; background: var(--primary); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
<script>
  // Same saved theme as the rest of the app (self-contained: no other files may load here).
  (function () { var p = 'light'; try { p = localStorage.getItem('ryl.theme') || 'light'; } catch (e) {}
    var d = p === 'dark' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = d ? '#101713' : '#F7F8F5'; })();
</script>
</head>
<body>
<main class="off">
  <div class="card">
    <span class="crest"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg></span>
    <h1>You're offline</h1>
    <p>Ticking habits needs the internet so your points are saved safely. Turn on mobile data or Wi-Fi, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>
</main>
<script>document.getElementById('retry').addEventListener('click', () => location.reload()); addEventListener('online', () => location.reload());</script>
</body>
</html>
