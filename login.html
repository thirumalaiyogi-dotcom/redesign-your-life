<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Log in · Redesign Your Life</title>
<meta name="description" content="Log in to Deepak's Redesign Your Life to tick today's habits.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Redesign Life">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@500..800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
<main class="auth">
  <div class="auth-art" aria-hidden="true">
    <canvas id="art-canvas"></canvas>
    <div class="quote"><span class="eyebrow" style="color:var(--gold)">Small habits | Big transformation</span><h2>Get <span class="gold-text">1% better</span><br>every day.</h2></div>
  </div>
  <div class="auth-form">
    <form class="auth-card form" id="login-form" novalidate>
      <a class="brand" href="./"><span class="crest" data-icon="crown"></span><span><b>Redesign Your Life</b><small>Deepak's Program</small></span></a>
      <div><h1>Welcome back</h1><p class="sub">Log in to tick today's habits.</p></div>
      <div id="notice" hidden></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
        <span class="err" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required><button type="button"></button></div>
        <span class="err" aria-live="polite"></span>
      </div>
      <div class="row-between">
        <label class="check"><input type="checkbox" id="remember" checked>Keep me logged in</label>
        <a class="link" href="forgot.html">Forgot password?</a>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="login-btn">Log in</button>
      <p class="muted" style="text-align:center;font-size:14px">New member? <a class="link" href="register.html">Create your account</a></p>
    </form>
  </div>
</main>
<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/auth-pages.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
